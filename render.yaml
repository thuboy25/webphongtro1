services:
  - type: web
    name: wephongtro
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn wephongtro.wsgi
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://wephongtro.onrender.com"
