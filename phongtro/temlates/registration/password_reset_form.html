<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khôi phục mật khẩu</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 text-slate-800">
    <div class="mx-auto mt-16 max-w-lg rounded-2xl bg-white p-6 shadow">
      <h1 class="text-2xl font-bold text-slate-900">Khôi phục mật khẩu</h1>
      <p class="mt-2 text-sm text-slate-500">Nhập email của bạn để nhận liên kết đặt lại mật khẩu.</p>

      <form method="post" class="mt-6 space-y-4">
        {% csrf_token %}
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700" for="id_email">Email</label>
          <input type="email" name="email" id="id_email" required class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm" />
          {% if form.email.errors %}
          <p class="mt-1 text-sm text-red-600">{{ form.email.errors|join:', ' }}</p>
          {% endif %}
        </div>
        <div class="flex items-center justify-between gap-3">
          <a href="{% url 'phongtro:login' %}" class="text-sm font-medium text-slate-600 hover:text-slate-900">Quay lại đăng nhập</a>
          <button type="submit" class="rounded-xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white hover:bg-slate-800">Gửi email khôi phục</button>
        </div>
      </form>
    </div>
  </body>
</html>
